<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Sign up</h1>
        <p>All fields are required.</p>

        <form id="signup" novalidate>
            <label for="name">Full name</label>
            <input id="name" name="name" autocomplete="name" required aria-describedby="name-error">
            <p class="error" id="name-error"></p>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
            <p class="error" id="email-error"></p>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password"
                minlength="8" required aria-describedby="password-help password-error">
            <p class="help" id="password-help">Use at least 8 characters.</p>
            <p class="error" id="password-error"></p>

            <button type="submit">Sign up</button>
        </form>

        <p id="status" role="status"></p>
    </main>
</body>
</html>
